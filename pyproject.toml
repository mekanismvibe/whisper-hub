[project]
name = "whisper-hub"
version = "0.1.0"
description = "Self-hosted Whisper gateway with per-device keys and a shared English transcript history."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.1,<1.3",
    # faster-whisper 1.2.x passes metadata_errors to av.open, which PyAV 17+ removed.
    "av>=11,<17",
    "segno>=1.6",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# CUDA 12 + cuDNN 9 runtime for CTranslate2 on GPU hosts: uv sync --extra cuda
cuda = [
    "nvidia-cublas-cu12>=12,<13",
    "nvidia-cudnn-cu12>=9,<10",
]
parakeet = [
    "moondream>=2.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
whisper-hub = "whisper_hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisper_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "model: integration test that downloads and runs the real faster-whisper tiny model",
]
